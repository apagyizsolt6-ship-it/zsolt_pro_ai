// ============================================================================
// Zsolt Pro AI - Android App Build Gradle (Desugaring Enabled)
// File: android/app/build.gradle
// ============================================================================

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "hu.zsoltproai.zsolt_pro_ai"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        
        // 🚀 Itt van fixen bekapcsolva a desugaring
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "hu.zsoltproai.zsolt_pro_ai"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // 🚀 Kötelező a desugaring lib a notifications csomaghoz
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
