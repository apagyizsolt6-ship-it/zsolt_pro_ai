name: zsolt_pro_ai
description: "Zsolt Pro AI application with StatPal API integration."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  # Itt tartjuk a meglévő saját és külső csomagodat, amik eddig is benne voltak:
  # (Ha volt még egyéb csomag a projektedben, azt is ide tudod sorolni, de ez a legfontosabb mag)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Ha használsz saját képeket, asseteket vagy betűtípusokat, itt tudod beállítani:
  # assets:
  #   - assets/
